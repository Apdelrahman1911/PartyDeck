// Read-only per-project dependency report. See docs/dependency-licenses.md.
// Output includes machine-local cache paths; keep raw reports outside version control.
import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

gradle.projectsEvaluated {
    rootProject.allprojects.each { targetProject ->
        def requested = targetProject.path == ':androidApp' ? ['releaseRuntimeClasspath'] :
            targetProject.path == ':composeApp' ? ['jvmRuntimeClasspath', 'iosArm64CompileKlibraries', 'iosSimulatorArm64CompileKlibraries'] : []
        if (!requested.empty) {
            targetProject.tasks.register('partyDeckLicenseInventory') {
                doLast {
                    def reports = []
                    requested.each { configurationName ->
                        def configuration = targetProject.configurations.findByName(configurationName)
                        def target = [project: targetProject.path, configuration: configurationName]
                        if (configuration == null) {
                            reports << [target: target, error: 'configuration_missing', available: targetProject.configurations.findAll { it.canBeResolved }.collect { it.name }]
                        } else {
                            def artifacts = configuration.incoming.artifactView {
                                componentFilter { identifier -> identifier instanceof ModuleComponentIdentifier }
                            }.artifacts.artifacts.collect { artifact ->
                                def component = artifact.id.componentIdentifier
                                [coordinate: "${component.group}:${component.module}:${component.version}", file: artifact.file.absolutePath, exists: artifact.file.exists()]
                            }.sort { it.coordinate }
                            def components = configuration.incoming.resolutionResult.allComponents.findAll { it.id instanceof ModuleComponentIdentifier }.collect { it.id.displayName }.sort()
                            reports << [target: target, components: components, artifacts: artifacts]
                        }
                    }
                    println('PARTYDECK_LICENSE_INVENTORY=' + JsonOutput.toJson(reports))
                }
            }
        }
    }
}
