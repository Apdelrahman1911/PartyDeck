name: Godot iOS embedding probe

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Engine compilation or actual native host tests
        required: true
        type: choice
        default: engine
        options:
          - engine
          - test
      variant:
        description: Native Simulator debug or device release archive
        required: true
        type: choice
        default: simulator-debug
        options:
          - simulator-debug
          - device-release

permissions:
  contents: read

concurrency:
  group: godot-ios-probe-${{ github.ref }}-${{ inputs.variant || 'simulator-debug' }}
  cancel-in-progress: false

jobs:
  ios-probe:
    name: Build the iOS ${{ inputs.variant || 'simulator-debug' }} host
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      PARTYDECK_GODOT_PROBE_STAGE: ${{ inputs.stage }}
      PARTYDECK_GODOT_PROBE_VARIANT: ${{ inputs.variant || 'simulator-debug' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record Apple toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcodebuild -showsdks
          python3 --version
      - name: Cache content-addressed engine objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: godot/ios-host/build${{ inputs.variant == 'device-release' && '/device-release' || '' }}/scons-cache
          key: godot-ios-ed1daf0bf-xcode26.4.1-arm64-${{ inputs.variant == 'device-release' && 'device-release' || 'sim' }}-gl-${{ hashFiles('godot/ios-host/modules/**', 'godot/ios-host/build-probe.sh', 'godot/ios-host/source_audit.py', 'godot/ios-host/stage-engine-inputs.py', 'godot/ios-host/patches/**') }}
          restore-keys: |
            godot-ios-ed1daf0bf-xcode26.4.1-arm64-${{ inputs.variant == 'device-release' && 'device-release' || 'sim' }}-gl-
      - name: Execute the requested probe stage
        run: bash godot/ios-host/build-probe.sh "$PARTYDECK_GODOT_PROBE_STAGE" "$PARTYDECK_GODOT_PROBE_VARIANT"
      - name: Preserve native probe evidence
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: godot-ios-probe-${{ inputs.stage }}-${{ inputs.variant || 'simulator-debug' }}
          path: |
            godot/ios-host/build/evidence/**
            godot/ios-host/build/artifacts/**
            godot/ios-host/build/device-release/evidence/**
            godot/ios-host/build/device-release/artifacts/**
          retention-days: 14
          if-no-files-found: warn
