name: Apple toolchain smoke

# A focused manual probe for native rules/protocol work. Full application
# qualification remains in validate.yml; this does not duplicate its push jobs.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-toolchain-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-core:
    name: Core and session on Apple simulator
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK for KMP project configuration
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-37.1 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Verify installed Apple toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          test "$(uname -m)" = arm64
          java -version
          ./gradlew --version
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl help
      - name: Run rules and protocol tests on the matching iOS runtime
        run: |
          PARTYDECK_SIMULATOR_ID="$(python3 scripts/select-ios-simulator.py build/ci/ios/shared-simulator.json)"
          ./gradlew --stacktrace --console=plain --max-workers=2 \
            :core:iosSimulatorArm64Test --device "$PARTYDECK_SIMULATOR_ID" \
            :session:iosSimulatorArm64Test --device "$PARTYDECK_SIMULATOR_ID"
      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple-toolchain-smoke-reports
          path: |
            core/build/reports/**
            core/build/test-results/**
            session/build/reports/**
            session/build/test-results/**
            build/ci/ios/shared-simulator.json
          retention-days: 14
          if-no-files-found: warn
