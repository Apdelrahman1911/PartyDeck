name: Godot comparison qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-comparison-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bridge-and-packages:
    name: Shared authority, matched desktop gameplay and Android packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      runtime-inputs: ${{ steps.runtime-inputs.outcome }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the Android qualification checker on the host
        timeout-minutes: 2
        shell: bash
        run: |
          mkdir -p godot/qualification/build/ci
          python3 -B -m unittest discover -s godot/android-checks -p 'test_*.py' -v \
            2>&1 | tee godot/qualification/build/ci/android-checker-tests.log
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-37.1 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Install graphics support
        run: ./scripts/setup-ubuntu-graphics.sh
      - name: Install checksum-verified Godot
        run: python3 godot/tools/renderer.py install --destination godot/qualification/build/toolchain
      - name: Test the bridge and build the desktop authority runner
        run: |
          ./gradlew -p godot/qualification --console=plain \
            :bridge:jvmTest :bridge:generateFixtures \
            :comparison:test :comparison:installDist
      - name: Validate both real scenes and export their PCK
        id: renderer-pack
        run: python3 godot/tools/renderer.py pack --godot godot/qualification/build/toolchain/godot
      - name: Check packed bridge discovery and rapid scene teardown
        timeout-minutes: 2
        shell: bash
        run: |
          mkdir -p godot/qualification/build/ci/native-boundary/empty
          godot/qualification/build/toolchain/godot --headless \
            --path "$GITHUB_WORKSPACE/godot/qualification/build/ci/native-boundary/empty" \
            --main-pack "$GITHUB_WORKSPACE/godot/qualification/build/renderer/partydeck-last-light.pck" \
            --audio-driver Dummy \
            --script "$GITHUB_WORKSPACE/godot/renderer/tests/native_bridge_check.gd" -- \
            --check-output="$GITHUB_WORKSPACE/godot/qualification/build/ci/native-boundary/results" \
            --check-fixtures="$GITHUB_WORKSPACE/godot/bridge/fixtures" \
            2>&1 | tee godot/qualification/build/ci/native-boundary/runtime.log
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          output = Path('godot/qualification/build/ci/native-boundary')
          report = json.loads((output / 'results/report.json').read_text())
          if report.get('result') != 'passed' or not report.get('checks'):
              raise SystemExit('The packed native bridge boundary check did not pass.')
          if any(check.get('passed') is not True for check in report['checks']):
              raise SystemExit('The boundary report contains a failed assertion.')
          if re.search(r'(?m)^(?:SCRIPT ERROR|ERROR|Parse Error):', (output / 'runtime.log').read_text()):
              raise SystemExit('The engine reported an error despite its process exit status.')
          print(f"{len(report['checks'])} packed boundary assertions passed without engine errors.")
          PY
      - name: Check terminal return rendering and restoration from the exported PCK
        timeout-minutes: 2
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: |
          mkdir -p godot/qualification/build/ci/terminal-return/empty
          xvfb-run -a godot/qualification/build/toolchain/godot \
            --path "$GITHUB_WORKSPACE/godot/qualification/build/ci/terminal-return/empty" \
            --main-pack "$GITHUB_WORKSPACE/godot/qualification/build/renderer/partydeck-last-light.pck" \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --script "$GITHUB_WORKSPACE/godot/renderer/tests/terminal_return_render_check.gd" -- \
            --manual-bridge \
            --check-output="$GITHUB_WORKSPACE/godot/qualification/build/ci/terminal-return/results" \
            --check-fixtures="$GITHUB_WORKSPACE/godot/bridge/fixtures" \
            2>&1 | tee godot/qualification/build/ci/terminal-return/runtime.log
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          output = Path('godot/qualification/build/ci/terminal-return')
          report = json.loads((output / 'results/report.json').read_text())
          if report.get('result') != 'passed' or not report.get('checks'):
              raise SystemExit('The packed terminal-return rendering check did not pass.')
          if any(check.get('passed') is not True for check in report['checks']):
              raise SystemExit('The terminal-return report contains a failed assertion.')
          if re.search(r'(?m)^(?:SCRIPT ERROR|ERROR|Parse Error):', (output / 'runtime.log').read_text()):
              raise SystemExit('The engine reported an error despite its process exit status.')
          print(f"{len(report['checks'])} packed terminal-return assertions passed without engine errors.")
          PY
      - name: Exercise matched 2D and 3D gameplay from the exported PCK
        timeout-minutes: 10
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: |
          godot/qualification/build/modules/comparison/install/partydeck-godot-compare/bin/partydeck-godot-compare \
            --godot godot/qualification/build/toolchain/godot \
            --pack godot/qualification/build/renderer/partydeck-last-light.pck \
            --presentation both --seed 2 --size 430x932 --xvfb --seconds 240 \
            --output godot/qualification/build/ci/desktop
      - name: Lint and package the native Android comparison host
        id: android-package
        if: ${{ !cancelled() && steps.renderer-pack.outcome == 'success' }}
        run: |
          ./gradlew -p godot/qualification --console=plain \
            :androidRenderer:testDebugUnitTest :androidHost:testDebugUnitTest :androidHost:lintDebug \
            :androidHost:assembleDebug :androidHost:assembleRelease :androidHost:bundleRelease
      - name: Preserve the exact debug runtime inputs
        id: runtime-inputs
        if: ${{ !cancelled() && steps.android-package.outcome == 'success' }}
        uses: ./.github/actions/upload-artifact
        with:
          name: godot-comparison-runtime-apk
          path: |
            godot/qualification/build/modules/androidHost/outputs/apk/debug/**
            godot/qualification/build/renderer/partydeck-last-light.pck
            godot/qualification/build/renderer/partydeck-last-light.receipt.json
          retention-days: 14
          if-no-files-found: error
      - name: Preserve build and validation evidence
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: godot-comparison-builds
          path: |
            godot/qualification/build/modules/**/reports/**
            godot/qualification/build/modules/**/test-results/**
            godot/qualification/build/modules/androidHost/outputs/apk/release/**
            godot/qualification/build/modules/androidHost/outputs/bundle/**
            godot/qualification/build/modules/androidHost/outputs/mapping/**
            godot/qualification/build/modules/comparison/install/**
            godot/qualification/build/renderer/**
            godot/qualification/build/toolchain/install.receipt.json
            godot/qualification/build/ci/android-checker-tests.log
            godot/qualification/build/ci/native-boundary/**
            godot/qualification/build/ci/terminal-return/**
            godot/qualification/build/ci/desktop/**
            build/ci/android/graphics-*.log
          retention-days: 14
          if-no-files-found: warn

  android-runtime:
    name: Android ${{ matrix.presentation }} / ${{ matrix.font_scale }}x text / debug
    needs: bridge-and-packages
    if: ${{ !cancelled() && needs.bridge-and-packages.outputs.runtime-inputs == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        presentation: ['2d', '3d']
        font_scale: ['1.0', '2.0']
    steps:
      - name: Check out the same source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java for Android SDK tools
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up the standard Android 35 runtime image
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools emulator system-images;android-35;default;x86_64'
          log-accepted-android-sdk-licenses: false
      - name: Download the debug APK and PCK from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: godot-comparison-runtime-apk
          path: godot/qualification/build
      - name: Verify the downloaded PCK against this source checkout
        run: |
          python3 -B godot/tools/renderer.py check-pack \
            --pack godot/qualification/build/renderer/partydeck-last-light.pck
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import zipfile

          build = Path('godot/qualification/build')
          apk = build / 'modules/androidHost/outputs/apk/debug/androidHost-debug.apk'
          pack = build / 'renderer/partydeck-last-light.pck'
          digest = hashlib.sha256()
          with apk.open('rb') as stream:
              for block in iter(lambda: stream.read(1048576), b''):
                  digest.update(block)
          apk_hash = digest.hexdigest()
          with zipfile.ZipFile(apk) as archive:
              entry = 'assets/partydeck-last-light.pck'
              if archive.namelist().count(entry) != 1:
                  raise SystemExit('The debug APK must contain exactly one renderer PCK.')
              embedded_hash = hashlib.sha256(archive.read(entry)).hexdigest()
          pack_hash = hashlib.sha256(pack.read_bytes()).hexdigest()
          report = build / 'ci/package-inputs.json'
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text(json.dumps({
              'sourceCommit': os.environ['GITHUB_SHA'], 'apkSha256': apk_hash,
              'packSha256': pack_hash, 'embeddedPackSha256': embedded_hash,
              'samePack': embedded_hash == pack_hash,
          }, indent=2) + '\n')
          if embedded_hash != pack_hash:
              raise SystemExit('The APK renderer PCK differs from the exported comparison PCK.')
          PY
      - name: Enable runner KVM access
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Exercise real touch and native lifecycle on a fresh AVD
        timeout-minutes: 40
        env:
          PARTYDECK_GODOT_CI_MODE: ${{ matrix.presentation }}
          PARTYDECK_GODOT_CI_FONT_SCALE: ${{ matrix.font_scale }}
        run: |
          timeout --signal=TERM --kill-after=30s 38m bash godot/android-checks/emulator.sh \
            godot/qualification/build/modules/androidHost/outputs/apk/debug/androidHost-debug.apk \
            "$PARTYDECK_GODOT_CI_MODE" "$PARTYDECK_GODOT_CI_FONT_SCALE" \
            godot/qualification/build/ci/android
      - name: Preserve native runtime evidence
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: godot-android-${{ matrix.presentation }}-font-${{ matrix.font_scale }}-debug
          path: |
            godot/qualification/build/ci/package-inputs.json
            godot/qualification/build/ci/android/**/*.log
            godot/qualification/build/ci/android/**/*.json
            godot/qualification/build/ci/android/**/*.xml
            godot/qualification/build/ci/android/**/*.png
          retention-days: 14
          if-no-files-found: warn
