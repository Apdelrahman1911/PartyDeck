name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to validate for this manual run
        required: true
        type: choice
        default: all
        options:
          - all
          - android
          - ios
      android_api:
        description: Android runtime API (API 36 remains an unresolved runner qualification)
        required: true
        type: choice
        default: '35'
        options:
          - '35'
          - '36'

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Android and shared JVM tests
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PARTYDECK_ANDROID_API: ${{ inputs.android_api || '35' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-37.1 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Install graphics support for Compose tests
        run: ./scripts/setup-ubuntu-graphics.sh
      - name: Record toolchain
        run: |
          java -version
          ./gradlew --version
          sdkmanager --list_installed
      - name: Test, lint, and package Android
        run: xvfb-run -a ./scripts/validate-android.sh
      - name: Release Gradle build workers before emulator startup
        if: ${{ !cancelled() && hashFiles('androidApp/build/outputs/apk/debug/*.apk') != '' }}
        run: ./gradlew --stop
      - name: Install the Android runtime test image
        if: ${{ !cancelled() && hashFiles('androidApp/build/outputs/apk/debug/*.apk') != '' }}
        run: |
          case "$PARTYDECK_ANDROID_API" in
            35|36) ;;
            *) printf '%s\n' 'PARTYDECK_ANDROID_API must be 35 or 36.' >&2; exit 1 ;;
          esac
          sdkmanager 'emulator' "system-images;android-${PARTYDECK_ANDROID_API};default;x86_64"
      - name: Enable runner KVM access
        if: ${{ !cancelled() && hashFiles('androidApp/build/outputs/apk/debug/*.apk') != '' }}
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Exercise debug and optimized Android APKs
        if: ${{ !cancelled() && hashFiles('androidApp/build/outputs/apk/debug/*.apk') != '' }}
        timeout-minutes: 30
        run: ./scripts/smoke-android-emulator.sh
      - name: Upload test and lint reports
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: android-jvm-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
            composeApp/build/ui-snapshots/**
            build/ci/android/**/*.log
            build/ci/android/**/*.json
            build/ci/android/**/*.xml
            build/ci/android/**/*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Upload Android packages
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: android-packages-and-shrinker-reports
          path: |
            androidApp/build/outputs/apk/debug/*.apk
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/bundle/release/*.aab
            androidApp/build/outputs/mapping/release/**
            build/ci/android/packages/*.apk
          retention-days: 14
          if-no-files-found: warn

  ios:
    name: iOS native tests and app smoke
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios' }}
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK for KMP project configuration
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-37.1 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Record and check Apple toolchain
        id: apple-toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          test "$(uname -m)" = arm64
          java -version
          ./gradlew --version
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl help
      - name: Run native shared tests and link device framework
        run: ./scripts/validate-ios-shared.sh
      - name: Preserve native shared test evidence before app compilation
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: ios-shared-native-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
            build/ci/ios/*.json
          retention-days: 14
          if-no-files-found: warn
      - name: Build and test the iOS Simulator application
        id: ios-app
        if: ${{ !cancelled() && steps.apple-toolchain.outcome == 'success' }}
        timeout-minutes: 40
        run: ./scripts/validate-ios-app.sh
      - name: Upload iOS reports and simulator app
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: ios-reports-and-simulator-app
          path: |
            build/ci/ios/*.log
            build/ci/ios/*.json
            build/ci/ios/*.png
            build/ci/ios/*.tar.gz
            build/ci/ios/PartyDeck.xcresult/**
            build/ci/ios/attachments/**
            build/ci/ios/interop/**
            build/ci/ios/**/*LinkMap*.txt
            composeApp/build/bin/ios*/debugFramework/PartyDeckKit.framework/Headers/**
            iosApp/PartyDeck.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          retention-days: 14
          if-no-files-found: warn
      - name: Build the optimized unsigned iOS device application
        if: ${{ !cancelled() && steps.ios-app.outcome == 'success' }}
        timeout-minutes: 40
        run: ./scripts/validate-ios-device.sh
      - name: Upload optimized iOS device evidence
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: ios-unsigned-release-device-app
          path: |
            build/ci/ios/xcodebuild-device.log
            build/ci/ios/PartyDeck-device-unsigned.app.tar.gz
            build/ci/ios/DeviceDerivedData/**/*LinkMap*.txt
            composeApp/build/bin/iosArm64/releaseFramework/PartyDeckKit.framework/Headers/**
          retention-days: 14
          if-no-files-found: warn
