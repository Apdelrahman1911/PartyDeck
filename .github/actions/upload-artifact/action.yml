name: Upload artifact with one retry
description: Retry one failed pinned artifact upload and fail if both attempts fail.
inputs:
  name:
    description: Artifact name, unique within this workflow run.
    required: true
  path:
    description: Files or patterns to upload.
    required: true
  retention-days:
    description: Artifact retention period.
    default: '14'
  if-no-files-found:
    description: Behavior when no matching files exist.
    default: warn
outputs:
  artifact-id:
    description: ID from the successful upload attempt.
    value: ${{ steps.retry.outputs.artifact-id || steps.first.outputs.artifact-id }}
  artifact-url:
    description: URL from the successful upload attempt.
    value: ${{ steps.retry.outputs.artifact-url || steps.first.outputs.artifact-url }}
  artifact-digest:
    description: SHA-256 from the successful upload attempt.
    value: ${{ steps.retry.outputs.artifact-digest || steps.first.outputs.artifact-digest }}
runs:
  using: composite
  steps:
    - name: Upload artifact
      id: first
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      continue-on-error: true
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
    - name: Wait before the single upload retry
      if: ${{ !cancelled() && steps.first.outcome == 'failure' }}
      shell: bash
      run: sleep 10
    - name: Retry artifact upload
      id: retry
      if: ${{ !cancelled() && steps.first.outcome == 'failure' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      continue-on-error: true
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        # A failed request may have created a partial artifact with this name.
        overwrite: true
    - name: Require a successful upload attempt
      if: ${{ !cancelled() && steps.first.outcome != 'success' && steps.retry.outcome != 'success' }}
      shell: bash
      run: |
        printf '%s\n' 'Artifact upload failed after the single retry; evidence was not preserved.' >&2
        exit 1
